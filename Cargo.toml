[package]
name = "sofdocs-server"
version = "0.1.0"
edition = "2021"
description = "SofDocs API server — document management, collaboration, authentication"
license = "AGPL-3.0-or-later"

[dependencies]
sofdocs-core = { path = "../core" }
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-multipart = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
futures-util = "0.3"
